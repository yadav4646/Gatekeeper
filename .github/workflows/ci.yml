name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build and start gateway + demo upstreams
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait gateway
      - name: Smoke test over HTTP
        run: scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
