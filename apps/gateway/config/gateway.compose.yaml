# Config used by deploy/docker-compose.yml. Upstreams are reached by service name on
# the internal compose network; only the gateway publishes a port.
listen:
  host: 0.0.0.0
  port: 8080

allowedHosts: [localhost, 127.0.0.1, '[::1]', gateway]
allowedOrigins: [localhost, 127.0.0.1, '[::1]']

# Demo upstreams speak plain http on the private compose network only.
allowInsecureUpstreams: true

upstreams:
  - slug: crm
    url: http://demo-crm:9101/mcp
  - slug: files
    url: http://demo-files:9102/mcp
